name: Export TClean source ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build safe source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git archive HEAD | tar -x -C export
          rm -f export/.env export/.env.development export/.github/workflows/export-tclean-zip.yml
          cat > export/.env.example <<'EOF'
          SUPABASE_PROJECT_ID=your-project-id
          SUPABASE_PUBLISHABLE_KEY=your-publishable-key
          SUPABASE_URL=https://your-project.supabase.co
          VITE_SUPABASE_PROJECT_ID=your-project-id
          VITE_SUPABASE_PUBLISHABLE_KEY=your-publishable-key
          VITE_SUPABASE_URL=https://your-project.supabase.co
          VITE_PAYMENTS_CLIENT_TOKEN=
          EOF
          (cd export && zip -qr ../TClean-site-modifie.zip .)

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TClean-site-modifie
          path: TClean-site-modifie.zip
          if-no-files-found: error
          retention-days: 7
